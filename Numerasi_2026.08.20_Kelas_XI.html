<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Numerasi - Kelas XI (Fungsi)</title>

  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 20px;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 820px;
      background: var(--card-bg);
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
      position: relative;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      border-bottom: 2px solid var(--border);
      padding-bottom: 12px;
    }
    .top-bar h2 { font-size: 1.25rem; color: var(--primary); }
    .btn-fs {
      background: #64748b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .btn-fs:hover { background: #475569; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    select, input[type="text"] {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      background: #fff;
    }
    select:focus, input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 11px 22px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 24px;
    }

    .progress-wrap {
      height: 8px;
      background: var(--border);
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 20px;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      transition: width 0.3s ease;
      border-radius: 99px;
    }

    .question-card {
      padding: 20px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: #fafafa;
    }
    .question-title {
      font-weight: 700;
      margin-bottom: 14px;
      color: var(--primary);
      font-size: 1.05rem;
    }
    .question-text {
      font-size: 1.08rem;
      margin-bottom: 18px;
      line-height: 1.65;
    }
    .option-item {
      display: flex;
      align-items: flex-start;
      margin-bottom: 10px;
      cursor: pointer;
      background: white;
      padding: 13px 14px;
      border: 2px solid var(--border);
      border-radius: 8px;
      transition: all 0.15s;
    }
    .option-item:hover { background: #f1f5f9; border-color: #93c5fd; }
    .option-item.selected { border-color: var(--primary); background: #eff6ff; }
    .option-item input { margin-right: 12px; margin-top: 4px; accent-color: var(--primary); flex-shrink: 0; }
    .option-item span { flex: 1; line-height: 1.5; }

    .hidden { display: none !important; }

    .pembahasan-box {
      background-color: #fefce8;
      border: 1px solid #fef08a;
      padding: 16px;
      border-radius: 8px;
      margin-top: 12px;
      font-size: 0.95rem;
      line-height: 1.65;
    }
    .pembahasan-header {
      font-weight: bold;
      color: #854d0e;
      margin-bottom: 8px;
    }

    .status-msg {
      text-align: center;
      padding: 12px;
      margin-top: 15px;
      border-radius: 6px;
      font-weight: 600;
    }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-loading { background: #e0f2fe; color: #0369a1; }
    .status-error { background: #fee2e2; color: #991b1b; }

    .score-big {
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--primary);
      text-align: center;
      line-height: 1.1;
      margin: 8px 0;
    }
    .score-sub {
      text-align: center;
      color: #64748b;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 99px;
      font-size: 0.78rem;
      font-weight: 600;
      margin-left: 8px;
      vertical-align: middle;
    }
    .badge-benar { background: #dcfce7; color: #166534; }
    .badge-salah { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="top-bar">
    <h2>Kuis Numerasi - Kelas XI (Fungsi)</h2>
    <button class="btn-fs" onclick="toggleFullscreen()">Layar Penuh ⛶</button>
  </div>

  <!-- ==================== FORM IDENTITAS ==================== -->
  <div id="formSection">
    <div class="form-group">
      <label for="kelas">Rombel Kelas:</label>
      <select id="kelas">
        <option value="">-- Pilih Rombel --</option>
        <!-- Opsi XI-01 s.d. XI-12 diisi lewat JS -->
      </select>
    </div>

    <div class="form-group">
      <label for="noPresensi">No Presensi:</label>
      <select id="noPresensi">
        <option value="">-- Pilih No Presensi --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="nama">Nama Singkat:</label>
      <input type="text" id="nama" placeholder="Masukkan nama panggilan / singkat" maxlength="40">
    </div>

    <button class="btn" style="width: 100%; margin-top: 10px;" onclick="startQuiz()">Mulai Kuis</button>
  </div>

  <!-- ==================== QUIZ SECTION ==================== -->
  <div id="quizSection" class="hidden">
    <div class="progress-wrap">
      <div class="progress-fill" id="progressBar" style="width: 0%"></div>
    </div>
    <div id="questionContainer"></div>

    <div class="nav-buttons">
      <button id="btnPrev" class="btn btn-secondary" onclick="changeQuestion(-1)">← Sebelumnya</button>
      <button id="btnNext" class="btn" onclick="changeQuestion(1)">Selanjutnya →</button>
      <button id="btnSubmit" class="btn hidden" style="background: var(--success);" onclick="submitQuiz()">Selesai & Kirim</button>
    </div>
  </div>

  <!-- ==================== RESULT + PEMBAHASAN ==================== -->
  <div id="resultSection" class="hidden">
    <h3 style="text-align:center; margin-bottom: 8px;">Hasil Kuis Anda</h3>
    <div class="score-big" id="scoreDisplay">0</div>
    <div class="score-sub" id="scoreSub"></div>

    <div id="statusSending" class="status-msg status-loading">Mengirim nilai ke Google Sheet...</div>

    <hr style="margin: 28px 0; border: none; border-top: 1px solid var(--border);">
    <h3 style="margin-bottom: 16px;">Pembahasan Soal Lengkap</h3>
    <div id="pembahasanContainer"></div>
  </div>
</div>

<script>
  // ===================== KONFIGURASI =====================
  // Untuk Kelas XI: Sheet = 4 + nomorKuis
  // Sheet 8 → nomorKuis = 4
  const kuisKe = "4";
  const webAppsUrl = "https://script.google.com/macros/s/AKfycbxVl8biOVtl1JJPC9ezT1DKx3fBO6Bp_gQFAnTbwQqJ0igKZuKdwuuHgXd5wi0vaMvD/exec";

  // ===================== DATA SOAL =====================
  const originalQuestions = [
    {
      id: 1,
      type: "MC",
      text: `Sebuah usaha percetakan menentukan biaya produksinya berdasarkan banyaknya kalender yang dicetak. Biaya tetap untuk setiap pesanan adalah <b>Rp 50.000</b>, sedangkan biaya mencetak setiap kalender adalah <b>Rp 8.000</b>.<br><br>
             Jika \\( x \\) menyatakan banyaknya kalender yang dicetak dan \\( C(x) \\) menyatakan total biaya produksi dalam rupiah, manakah fungsi berikut yang menyatakan biaya produksi tersebut?`,
      options: [
        { text: "\\( C(x) = 50{.}000x + 8{.}000 \\)", isCorrect: false },
        { text: "\\( C(x) = 58{.}000x \\)", isCorrect: false },
        { text: "\\( C(x) = 8{.}000x + 50{.}000 \\)", isCorrect: true },
        { text: "\\( C(x) = 8{.}000(x + 50{.}000) \\)", isCorrect: false },
        { text: "\\( C(x) = 50{.}000(x + 8{.}000) \\)", isCorrect: false }
      ],
      explanation: `
        Biaya tetap (fixed cost) = Rp 50.000 (tidak bergantung pada banyaknya kalender).<br>
        Biaya variabel = Rp 8.000 per kalender.<br><br>
        Sehingga total biaya produksi:<br>
        \\[ C(x) = 8{.}000x + 50{.}000 \\]
        Jawaban yang benar adalah <b>C</b>.`
    },
    {
      id: 2,
      type: "MC",
      text: `Sebuah tempat parkir menerapkan tarif sebagai berikut:<br>
             • Biaya awal <b>Rp 5.000</b><br>
             • Tambahan <b>Rp 3.000</b> untuk setiap jam<br><br>
             Untuk parkir selama \\( x \\) jam, total biaya parkir dinyatakan oleh fungsi<br>
             \\[ f(x) = 5{.}000 + 3{.}000x \\]<br>
             Seorang pelanggan membayar total biaya parkir sebesar <b>Rp 26.000</b>. Berdasarkan fungsi di atas, berapa jam kendaraan tersebut diparkir?`,
      options: [
        { text: "5 jam", isCorrect: false },
        { text: "6 jam", isCorrect: false },
        { text: "7 jam", isCorrect: true },
        { text: "8 jam", isCorrect: false },
        { text: "9 jam", isCorrect: false }
      ],
      explanation: `
        Diketahui \\( f(x) = 26{.}000 \\).<br>
        \\[ 5{.}000 + 3{.}000x = 26{.}000 \\]
        \\[ 3{.}000x = 21{.}000 \\]
        \\[ x = \\dfrac{21{.}000}{3{.}000} = 7 \\]
        Jadi kendaraan diparkir selama <b>7 jam</b>.`
    },
    {
      id: 3,
      type: "MC",
      text: `Sebuah alat pengukur suhu menampilkan suhu dalam skala Fahrenheit. Hubungan antara suhu Celcius \\( C \\) dan suhu Fahrenheit \\( F \\) dinyatakan oleh<br>
             \\[ F(C) = \\dfrac{9}{5}C + 32 \\]<br>
             Seorang siswa memperoleh pembacaan suhu <b>95°F</b> dan ingin mengubahnya ke Celcius.<br><br>
             Jika \\( F^{-1} \\) menyatakan fungsi invers dari \\( F \\), berapakah nilai \\( F^{-1}(95) \\)?`,
      options: [
        { text: "\\( 25^\\circ\\mathrm{C} \\)", isCorrect: false },
        { text: "\\( 30^\\circ\\mathrm{C} \\)", isCorrect: false },
        { text: "\\( 35^\\circ\\mathrm{C} \\)", isCorrect: true },
        { text: "\\( 40^\\circ\\mathrm{C} \\)", isCorrect: false },
        { text: "\\( 45^\\circ\\mathrm{C} \\)", isCorrect: false }
      ],
      explanation: `
        Rumus konversi yang benar adalah \\( F = \\dfrac{9}{5}C + 32 \\), sehingga fungsi inversnya:<br>
        \\[ C = \\dfrac{5}{9}(F - 32) \\quad \\text{atau} \\quad F^{-1}(y) = \\dfrac{5}{9}(y - 32) \\]<br><br>
        Substitusi \\( y = 95 \\):<br>
        \\[ F^{-1}(95) = \\dfrac{5}{9}(95 - 32) = \\dfrac{5}{9} \\times 63 = 5 \\times 7 = 35 \\]
        Jadi \\( F^{-1}(95) = 35^\\circ\\mathrm{C} \\).`
    },
    {
      id: 4,
      type: "MC",
      text: `Sebuah toko memberikan <b>diskon 20%</b> untuk semua produk. Jika harga asli suatu barang adalah \\( x \\) rupiah, maka harga setelah diskon dinyatakan oleh fungsi<br>
             \\[ f(x) = 0{,}8x \\]<br>
             Andi membeli sebuah barang dengan harga <b>Rp 320.000</b> setelah diskon.<br><br>
             Jika \\( f^{-1} \\) menyatakan fungsi invers dari \\( f \\), berapakah harga asli barang tersebut?`,
      options: [
        { text: "Rp 360.000", isCorrect: false },
        { text: "Rp 380.000", isCorrect: false },
        { text: "Rp 400.000", isCorrect: true },
        { text: "Rp 420.000", isCorrect: false },
        { text: "Rp 450.000", isCorrect: false }
      ],
      explanation: `
        Diketahui \\( f(x) = 0{,}8x \\).<br>
        Cari fungsi invers:<br>
        \\[ y = 0{,}8x \\quad \\Rightarrow \\quad x = \\dfrac{y}{0{,}8} = 1{,}25y \\]
        Jadi \\( f^{-1}(y) = 1{,}25y \\).<br><br>
        Harga setelah diskon = 320.000, maka harga asli:<br>
        \\[ f^{-1}(320{.}000) = 1{,}25 \\times 320{.}000 = 400{.}000 \\]
        Jadi harga asli barang adalah <b>Rp 400.000</b>.`
    },
    {
      id: 5,
      type: "MC",
      text: `Sebuah perusahaan minuman memproduksi botol. Banyaknya botol yang dapat diproduksi dalam \\( t \\) jam dimodelkan oleh fungsi<br>
             \\[ P(t) = 100t^{2} + 200t \\quad (t \\ge 0) \\]<br>
             Perusahaan menerima pesanan sebanyak <b>1.200 botol</b>. Berapa lama waktu yang dibutuhkan perusahaan untuk memenuhi pesanan tersebut?`,
      options: [
        { text: "2 jam", isCorrect: false },
        { text: "3 jam", isCorrect: true },
        { text: "4 jam", isCorrect: false },
        { text: "5 jam", isCorrect: false },
        { text: "6 jam", isCorrect: false }
      ],
      explanation: `
        Selesaikan persamaan \\( P(t) = 1{.}200 \\):<br>
        \\[ 100t^{2} + 200t = 1{.}200 \\]
        \\[ 100t^{2} + 200t - 1{.}200 = 0 \\]
        Bagi seluruh persamaan dengan 100:<br>
        \\[ t^{2} + 2t - 12 = 0 \\]
        Faktorkan:<br>
        \\[ (t + 4)(t - 3) = 0 \\]
        \\[ t = -4 \\quad \\text{atau} \\quad t = 3 \\]
        Karena \\( t \\ge 0 \\), maka \\( t = 3 \\).<br>
        Jadi waktu yang dibutuhkan adalah <b>3 jam</b>.`
    }
  ];

  // ===================== STATE =====================
  let shuffledQuestions = [];
  let currentQuestionIndex = 0;
  let userAnswers = {};
  let startTime;

  // ===================== INIT =====================
  window.onload = function() {
    // Isi rombel XI-01 s.d. XI-12
    const kelasSelect = document.getElementById("kelas");
    for (let i = 1; i <= 12; i++) {
      const num = i < 10 ? "0" + i : "" + i;
      kelasSelect.innerHTML += `<option value="XI-${num}">XI-${num}</option>`;
    }

    // Isi no presensi 1–40
    const presensiSelect = document.getElementById("noPresensi");
    for (let i = 1; i <= 40; i++) {
      presensiSelect.innerHTML += `<option value="${i}">${i}</option>`;
    }
  };

  function shuffle(array) {
    const newArray = JSON.parse(JSON.stringify(array));
    for (let i = newArray.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => alert("Gagal fullscreen: " + err.message));
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  // ===================== MULAI KUIS =====================
  function startQuiz() {
    const kelas = document.getElementById("kelas").value;
    const noPresensi = document.getElementById("noPresensi").value;
    const nama = document.getElementById("nama").value.trim();

    if (!kelas || !noPresensi || !nama) {
      alert("Harap lengkapi semua data diri terlebih dahulu!");
      return;
    }

    document.getElementById("formSection").classList.add("hidden");
    document.getElementById("quizSection").classList.remove("hidden");

    startTime = new Date();
    shuffledQuestions = shuffle(originalQuestions);
    shuffledQuestions.forEach(q => { q.options = shuffle(q.options); });

    currentQuestionIndex = 0;
    userAnswers = {};
    renderCurrentQuestion();
  }

  // ===================== RENDER SOAL =====================
  function renderCurrentQuestion() {
    const container = document.getElementById("questionContainer");
    const q = shuffledQuestions[currentQuestionIndex];
    const inputType = q.type === "MC" ? "radio" : "checkbox";
    const selected = userAnswers[currentQuestionIndex] || [];

    let optionsHTML = q.options.map((opt, optIdx) => {
      const isChecked = selected.includes(optIdx) ? "checked" : "";
      const selectedClass = selected.includes(optIdx) ? "selected" : "";
      return `
        <label class="option-item ${selectedClass}">
          <input type="${inputType}"
                 name="opt_${currentQuestionIndex}"
                 value="${optIdx}"
                 ${isChecked}
                 onchange="saveAnswer(${optIdx}, '${q.type}')">
          <span>${opt.text}</span>
        </label>
      `;
    }).join("");

    container.innerHTML = `
      <div class="question-card">
        <div class="question-title">Soal ${currentQuestionIndex + 1} dari ${shuffledQuestions.length}</div>
        <div class="question-text">${q.text}</div>
        <div>${optionsHTML}</div>
      </div>
    `;

    // Progress bar
    const progress = (currentQuestionIndex / shuffledQuestions.length) * 100;
    document.getElementById("progressBar").style.width = progress + "%";

    // Tombol navigasi
    document.getElementById("btnPrev").classList.toggle("hidden", currentQuestionIndex === 0);
    if (currentQuestionIndex === shuffledQuestions.length - 1) {
      document.getElementById("btnNext").classList.add("hidden");
      document.getElementById("btnSubmit").classList.remove("hidden");
    } else {
      document.getElementById("btnNext").classList.remove("hidden");
      document.getElementById("btnSubmit").classList.add("hidden");
    }

    // Render KaTeX
    if (window.renderMathInElement) {
      renderMathInElement(container, {
        delimiters: [
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    }
  }

  function saveAnswer(optIdx, type) {
    if (type === "MC") {
      userAnswers[currentQuestionIndex] = [optIdx];
    } else {
      if (!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = [];
      const arr = userAnswers[currentQuestionIndex];
      const pos = arr.indexOf(optIdx);
      if (pos > -1) arr.splice(pos, 1);
      else arr.push(optIdx);
    }
    renderCurrentQuestion();
  }

  function changeQuestion(direction) {
    currentQuestionIndex += direction;
    renderCurrentQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ===================== SUBMIT & SKOR =====================
  function submitQuiz() {
    const scorePerQuestion = 100 / shuffledQuestions.length;
    let totalScore = 0;

    shuffledQuestions.forEach((q, idx) => {
      const selectedIndices = userAnswers[idx] || [];
      if (q.type === "MC") {
        if (selectedIndices.length === 1 && q.options[selectedIndices[0]].isCorrect) {
          totalScore += scorePerQuestion;
        }
      }
    });

    totalScore = Math.round(totalScore);

    const endTime = new Date();
    const durationSec = Math.floor((endTime - startTime) / 1000);
    const minutes = Math.floor(durationSec / 60);
    const seconds = durationSec % 60;
    const waktuFormatted = `${minutes} menit ${seconds} detik`;

    document.getElementById("quizSection").classList.add("hidden");
    document.getElementById("resultSection").classList.remove("hidden");
    document.getElementById("scoreDisplay").innerText = totalScore;
    document.getElementById("scoreSub").innerText = `dari 100  •  Waktu: ${waktuFormatted}`;
    document.getElementById("progressBar").style.width = "100%";

    renderPembahasan();
    sendToGoogleSheet(totalScore, waktuFormatted);
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderPembahasan() {
    const container = document.getElementById("pembahasanContainer");
    container.innerHTML = "";

    shuffledQuestions.forEach((q, idx) => {
      const selectedIndices = userAnswers[idx] || [];
      const isCorrect = selectedIndices.length === 1 && q.options[selectedIndices[0]].isCorrect;

      const badge = isCorrect
        ? `<span class="badge badge-benar">Benar</span>`
        : `<span class="badge badge-salah">Salah</span>`;

      container.innerHTML += `
        <div class="question-card" style="margin-bottom: 20px;">
          <div class="question-title">Soal Nomor ${idx + 1} ${badge}</div>
          <div class="question-text">${q.text}</div>
          <div class="pembahasan-box">
            <div class="pembahasan-header">Pembahasan:</div>
            <div>${q.explanation}</div>
          </div>
        </div>
      `;
    });

    if (window.renderMathInElement) {
      renderMathInElement(container, {
        delimiters: [
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false }
        ],
        throwOnError: false
      });
    }
  }

  // ===================== KIRIM KE GOOGLE SHEET =====================
  function sendToGoogleSheet(nilai, waktu) {
    const kelas = document.getElementById("kelas").value; // sudah berbentuk "XI-01", "XI-02", dst.
    const noPresensi = document.getElementById("noPresensi").value;
    const nama = document.getElementById("nama").value.trim();

    const payload = new URLSearchParams();
    payload.append("kuisKe", kuisKe);      // "4" → Sheet 8 untuk kelas XI
    payload.append("kelas", kelas);
    payload.append("noPresensi", noPresensi);
    payload.append("nama", nama);
    payload.append("nilai", nilai);
    payload.append("waktu", waktu);

    fetch(webAppsUrl, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: payload
    })
    .then(() => {
      const el = document.getElementById("statusSending");
      el.className = "status-msg status-success";
      el.innerText = "✓ Nilai berhasil tersimpan di Google Sheet (Sheet 8)!";
    })
    .catch(err => {
      const el = document.getElementById("statusSending");
      el.className = "status-msg status-error";
      el.innerText = "Terjadi kesalahan saat mengirim data.";
      console.error(err);
    });
  }
