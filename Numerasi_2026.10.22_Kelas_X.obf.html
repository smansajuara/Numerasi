  let shuffledQuestions = [], currentQuestionIndex = 0, userAnswers = {}, startTime;

  window.onload = function() {
    const kelas = document.getElementById("kelas");
    for (let i = 1; i <= 12; i++) {
      const n = i < 10 ? "0"+i : ""+i;
      kelas.innerHTML += `<option value="X-${n}">X-${n}</option>`;
    }
    const pres = document.getElementById("noPresensi");
    for (let i = 1; i <= 40; i++) pres.innerHTML += `<option value="${i}">${i}</option>`;
    checkAccess();
  };

  function checkAccess() {
    const now = new Date();
    const inWindow = now >= openTime && now < closeTime;
    if (inWindow || accessGranted) {
      document.getElementById("gateSection").classList.add("hidden");
      document.getElementById("formSection").classList.remove("hidden");
    } else {
      document.getElementById("gateSection").classList.remove("hidden");
      document.getElementById("formSection").classList.add("hidden");
      document.getElementById("gateMessage").style.display = "block";
      const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jakarta' };
      document.getElementById("gateText").innerHTML = now < openTime
        ? `Kuis belum dibuka.<br>Dibuka: <strong>${openTime.toLocaleString('id-ID',opts)} WIB</strong><br>Ditutup: <strong>${closeTime.toLocaleString('id-ID',opts)} WIB</strong>`
        : `Kuis sudah ditutup.<br>Periode: 22–28 Oktober 2026.<br>Masukkan password untuk akses khusus.`;
    }
  }

  function tryPassword() {
    if (document.getElementById("accessPassword").value.trim() === ACCESS_PASSWORD) {
      accessGranted = true;
      checkAccess();
    } else alert("Password salah!");
  }

  function shuffle(a) {
    const arr = JSON.parse(JSON.stringify(a));
    for (let i = arr.length-1; i>0; i--) {
      const j = Math.floor(Math.random()*(i+1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(e=>alert(e.message));
    else if (document.exitFullscreen) document.exitFullscreen();
  }

  function isPembahasanUnlocked() {
    return accessGranted || (new Date() >= unlockPembahasan);
  }

  function startQuiz() {
    const kelas = document.getElementById("kelas").value;
    const no = document.getElementById("noPresensi").value;
    const nama = document.getElementById("nama").value.trim();
    if (!kelas || !no || !nama) { alert("Lengkapi semua data!"); return; }
    document.getElementById("formSection").classList.add("hidden");
    document.getElementById("quizSection").classList.remove("hidden");
    startTime = new Date();
    shuffledQuestions = shuffle(originalQuestions);
    shuffledQuestions.forEach(q => q.options = shuffle(q.options));
    currentQuestionIndex = 0; userAnswers = {};
    renderCurrentQuestion();
  }

  function renderCurrentQuestion() {
    const q = shuffledQuestions[currentQuestionIndex];
    const selected = userAnswers[currentQuestionIndex] || [];
    const inputType = q.type === "MC" ? "radio" : "checkbox";
    let opts = q.options.map((o,i) => {
      const chk = selected.includes(i) ? "checked" : "";
      const cls = selected.includes(i) ? "selected" : "";
      return `<label class="option-item ${cls}"><input type="${inputType}" name="opt_${currentQuestionIndex}" value="${i}" ${chk} onchange="saveAnswer(${i},'${q.type}')"><span>${o.text}</span></label>`;
    }).join("");
    document.getElementById("questionContainer").innerHTML = `
      <div class="question-card">
        <div class="question-title">Soal ${currentQuestionIndex+1} dari ${shuffledQuestions.length}
          ${q.type==="MA"?'<span style="font-weight:500;color:#64748b;font-size:0.9rem;">(Jawaban bisa lebih dari satu)</span>':''}
        </div>
        <div class="question-text">${q.text}</div>
        <div>${opts}</div>
      </div>`;
    document.getElementById("progressBar").style.width = (currentQuestionIndex/shuffledQuestions.length*100)+"%";
    document.getElementById("btnPrev").classList.toggle("hidden", currentQuestionIndex===0);
    const last = currentQuestionIndex === shuffledQuestions.length-1;
    document.getElementById("btnNext").classList.toggle("hidden", last);
    document.getElementById("btnSubmit").classList.toggle("hidden", !last);
    if (window.renderMathInElement) renderMathInElement(document.getElementById("questionContainer"), {
      delimiters: [{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}], throwOnError:false
    });
  }

  function saveAnswer(i, type) {
    if (type === "MC") userAnswers[currentQuestionIndex] = [i];
    else {
      if (!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = [];
      const arr = userAnswers[currentQuestionIndex];
      const pos = arr.indexOf(i);
      if (pos > -1) arr.splice(pos,1); else arr.push(i);
    }
    renderCurrentQuestion();
  }

  function changeQuestion(d) {
    currentQuestionIndex += d;
    renderCurrentQuestion();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function submitQuiz() {
    const per = 100 / shuffledQuestions.length;
    let total = 0;
    shuffledQuestions.forEach((q,idx) => {
      const sel = userAnswers[idx] || [];
      if (q.type === "MC") {
        if (sel.length===1 && q.options[sel[0]].isCorrect) total += per;
      } else {
        const cc = q.options.filter(o=>o.isCorrect).length;
        let uc=0, uw=0;
        sel.forEach(s => { if (q.options[s].isCorrect) uc++; else uw++; });
        if (uw===0 && uc>0) total += per * (uc/cc);
      }
    });
    total = Math.round(total);
    const dur = Math.floor((new Date()-startTime)/1000);
    const waktu = `${Math.floor(dur/60)} menit ${dur%60} detik`;
    document.getElementById("quizSection").classList.add("hidden");
    document.getElementById("resultSection").classList.remove("hidden");
    document.getElementById("scoreDisplay").innerText = total;
    document.getElementById("scoreSub").innerText = `dari 100  •  Waktu: ${waktu}`;
    document.getElementById("progressBar").style.width = "100%";
    sendToGoogleSheet(total, waktu);
    renderPembahasanArea();
    window.scrollTo({top:0,behavior:"smooth"});
  }

  function renderPembahasanArea() {
    const area = document.getElementById("pembahasanArea");
    if (!isPembahasanUnlocked()) {
      const opts = {weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',timeZone:'Asia/Jakarta'};
      area.innerHTML = `<div class="locked-box"><div class="lock-icon">🔒</div>
        <h4>Pembahasan masih terkunci</h4>
        <p>Dibuka pada: <strong>${unlockPembahasan.toLocaleString('id-ID',opts)} WIB</strong><br>
        (atau langsung terbuka jika Anda masuk dengan password)</p>
        <p style="margin-top:12px;font-size:0.88rem;">Nilai sudah tercatat. Silakan kembali nanti.</p></div>`;
    } else {
      let html = "";
      shuffledQuestions.forEach((q,idx) => {
        const sel = userAnswers[idx]||[];
        let ok = false;
        if (q.type === "MC") ok = sel.length===1 && q.options[sel[0]].isCorrect;
        else {
          const ck = q.options.map((o,i)=>o.isCorrect?i:-1).filter(i=>i!==-1).sort();
          ok = JSON.stringify(ck) === JSON.stringify([...sel].sort());
        }
        const badge = ok ? `<span class="badge badge-benar">Benar</span>` : `<span class="badge badge-salah">Salah</span>`;
        html += `<div class="question-card" style="margin-bottom:20px;">
          <div class="question-title">Soal ${idx+1} ${badge}</div>
          <div class="question-text">${q.text}</div>
          <div class="pembahasan-box"><div class="pembahasan-header">Pembahasan:</div>${q.explanation}</div>
        </div>`;
      });
      area.innerHTML = html;
      if (window.renderMathInElement) renderMathInElement(area, {
        delimiters: [{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}], throwOnError:false
      });
    }
  }

  function sendToGoogleSheet(nilai, waktu) {
    const payload = new URLSearchParams();
    payload.append("kuisKe", kuisKe);
    payload.append("kelas", document.getElementById("kelas").value);
    payload.append("noPresensi", document.getElementById("noPresensi").value);
    payload.append("nama", document.getElementById("nama").value.trim());
    payload.append("nilai", nilai);
    payload.append("waktu", waktu);
    fetch(webAppsUrl, {method:"POST", mode:"no-cors", headers:{"Content-Type":"application/x-www-form-urlencoded"}, body:payload})
    .then(() => {
      const el = document.getElementById("statusSending");
      el.className = "status-msg status-success";
      el.innerText = "✓ Nilai berhasil tersimpan di Google Sheet (Sheet 24)!";
    })
    .catch(() => {
      document.getElementById("statusSending").className = "status-msg status-error";
      document.getElementById("statusSending").innerText = "Terjadi kesalahan saat mengirim data.";
    });
  }
