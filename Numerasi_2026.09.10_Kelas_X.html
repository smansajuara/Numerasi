<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Numerasi - Kelas X (Penerapan Eksponen)</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 820px; background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
    .top-bar h2 { font-size: 1.15rem; color: var(--primary); }
    .btn-fs { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-fs:hover { background: #475569; }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.95rem; }
    select, input[type="text"], input[type="password"] {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; background: #fff;
    }
    select:focus, input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(37,99,235,0.15); }
    .btn { background: var(--primary); color: white; border: none; padding: 11px 22px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; transition: background 0.2s; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }
    .btn:disabled { background: #94a3b8; cursor: not-allowed; }
    .nav-buttons { display: flex; justify-content: space-between; gap: 12px; margin-top: 24px; }
    .progress-wrap { height: 8px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
    .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s ease; border-radius: 99px; }
    .question-card { padding: 20px; border: 1px solid var(--border); border-radius: 10px; background: #fafafa; }
    .question-title { font-weight: 700; margin-bottom: 14px; color: var(--primary); font-size: 1.05rem; }
    .question-text { font-size: 1.05rem; margin-bottom: 18px; line-height: 1.65; text-align: justify; }
    .option-item { display: flex; align-items: flex-start; margin-bottom: 10px; cursor: pointer; background: white; padding: 13px 14px; border: 2px solid var(--border); border-radius: 8px; transition: all 0.15s; }
    .option-item:hover { background: #f1f5f9; border-color: #93c5fd; }
    .option-item.selected { border-color: var(--primary); background: #eff6ff; }
    .option-item input { margin-right: 12px; margin-top: 4px; accent-color: var(--primary); flex-shrink: 0; }
    .option-item span { flex: 1; line-height: 1.5; }
    .note { font-size: 0.9rem; color: #64748b; font-style: italic; margin-top: 6px; }
    .hidden { display: none !important; }
    .pembahasan-box { background-color: #fefce8; border: 1px solid #fef08a; padding: 16px; border-radius: 8px; margin-top: 12px; font-size: 0.95rem; line-height: 1.65; }
    .pembahasan-header { font-weight: bold; color: #854d0e; margin-bottom: 8px; }
    .locked-box { background: #f1f5f9; border: 2px dashed #94a3b8; padding: 28px 20px; border-radius: 10px; text-align: center; margin-top: 16px; }
    .locked-box .lock-icon { font-size: 2.2rem; margin-bottom: 10px; }
    .locked-box h4 { color: #475569; margin-bottom: 8px; }
    .locked-box p { color: #64748b; font-size: 0.95rem; }
    .status-msg { text-align: center; padding: 12px; margin-top: 15px; border-radius: 6px; font-weight: 600; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-loading { background: #e0f2fe; color: #0369a1; }
    .status-error { background: #fee2e2; color: #991b1b; }
    .score-big { font-size: 2.8rem; font-weight: 800; color: var(--primary); text-align: center; line-height: 1.1; margin: 8px 0; }
    .score-sub { text-align: center; color: #64748b; margin-bottom: 16px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 99px; font-size: 0.78rem; font-weight: 600; margin-left: 8px; vertical-align: middle; }
    .badge-benar { background: #dcfce7; color: #166534; }
    .badge-salah { background: #fee2e2; color: #991b1b; }
    .access-box { background: #fff7ed; border: 1px solid #fed7aa; padding: 16px; border-radius: 8px; margin-bottom: 20px; }
    .access-box p { font-size: 0.92rem; color: #9a3412; margin-bottom: 10px; }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="top-bar">
    <h2>Kuis Numerasi - Kelas X (Penerapan Eksponen)</h2>
    <button class="btn-fs" onclick="toggleFullscreen()">Layar Penuh ⛶</button>
  </div>

  <!-- ==================== GATE / PASSWORD ==================== -->
  <div id="gateSection">
    <div id="gateMessage" class="access-box" style="display:none;">
      <p id="gateText"></p>
      <div class="form-group" style="margin-bottom:0;">
        <label for="accessPassword">Password akses:</label>
        <input type="password" id="accessPassword" placeholder="Masukkan password">
      </div>
      <button class="btn" style="width:100%;margin-top:12px;" onclick="tryPassword()">Buka dengan Password</button>
    </div>
  </div>

  <!-- ==================== FORM IDENTITAS ==================== -->
  <div id="formSection" class="hidden">
    <div class="form-group">
      <label for="kelas">Rombel Kelas:</label>
      <select id="kelas">
        <option value="">-- Pilih Rombel --</option>
      </select>
    </div>
    <div class="form-group">
      <label for="noPresensi">No Presensi:</label>
      <select id="noPresensi">
        <option value="">-- Pilih No Presensi --</option>
      </select>
    </div>
    <div class="form-group">
      <label for="nama">Nama Singkat:</label>
      <input type="text" id="nama" placeholder="Masukkan nama panggilan / singkat" maxlength="40">
    </div>
    <button class="btn" style="width:100%;margin-top:10px;" onclick="startQuiz()">Mulai Kuis</button>
  </div>

  <!-- ==================== QUIZ ==================== -->
  <div id="quizSection" class="hidden">
    <div class="progress-wrap">
      <div class="progress-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div id="questionContainer"></div>
    <div class="nav-buttons">
      <button id="btnPrev" class="btn btn-secondary" onclick="changeQuestion(-1)">← Sebelumnya</button>
      <button id="btnNext" class="btn" onclick="changeQuestion(1)">Selanjutnya →</button>
      <button id="btnSubmit" class="btn hidden" style="background:var(--success);" onclick="submitQuiz()">Selesai & Kirim</button>
    </div>
  </div>

  <!-- ==================== RESULT ==================== -->
  <div id="resultSection" class="hidden">
    <h3 style="text-align:center;margin-bottom:8px;">Hasil Kuis Anda</h3>
    <div class="score-big" id="scoreDisplay">0</div>
    <div class="score-sub" id="scoreSub"></div>
    <div id="statusSending" class="status-msg status-loading">Mengirim nilai ke Google Sheet...</div>
    <hr style="margin:28px 0;border:none;border-top:1px solid var(--border);">
    <h3 style="margin-bottom:12px;">Pembahasan Soal</h3>
    <div id="pembahasanArea"></div>
  </div>
</div>

<script>
  // ===================== KONFIGURASI =====================
  const kuisKe = "13";   // → Sheet 13 (Kelas X)
  const webAppsUrl = "https://script.google.com/macros/s/AKfycbxVl8biOVtl1JJPC9ezT1DKx3fBO6Bp_gQFAnTbwQqJ0igKZuKdwuuHgXd5wi0vaMvD/exec";
  const ACCESS_PASSWORD = "2627";

  // Jadwal akses kuis (WIB = UTC+7)
  const openTime  = new Date("2026-09-10T07:00:00+07:00");
  const closeTime = new Date("2026-09-16T06:00:00+07:00");

  // Pembahasan terbuka mulai 10 Sept 2026 07:35 WIB
  const unlockPembahasan = new Date("2026-09-10T07:35:00+07:00");

  // ===================== DATA SOAL =====================
  const originalQuestions = [
    {
      id: 1,
      type: "MC",
      text: `Sebuah laboratorium melakukan pengamatan terhadap pertumbuhan bakteri. Pada awal pengamatan terdapat 1.500 bakteri. Setiap 4 jam, jumlah bakteri menjadi 3 kali jumlah sebelumnya. Modelnya:<br>
             \\[ B(t) = 1500 \\cdot 3^{t/4} \\]<br>
             Laboratorium hanya dapat menampung paling banyak 364.500 bakteri.<br><br>
             <b>Pernyataan yang paling tepat adalah ....</b>`,
      options: [
        { text: "Kapasitas wadah tercapai setelah 12 jam karena \\( 3^{3} = 27 \\)", isCorrect: false },
        { text: "Kapasitas wadah tercapai setelah 16 jam karena \\( 3^{4} = 81 \\)", isCorrect: false },
        { text: "Kapasitas wadah tercapai setelah 20 jam karena \\( 3^{5} = 243 \\)", isCorrect: true },
        { text: "Kapasitas wadah tercapai setelah 24 jam karena \\( 3^{6} = 729 \\)", isCorrect: false },
        { text: "Kapasitas wadah tercapai setelah 28 jam karena \\( 3^{7} = 2187 \\)", isCorrect: false }
      ],
      explanation: `
        \\[ 1500 \\cdot 3^{t/4} = 364{.}500 \\]
        \\[ 3^{t/4} = 243 = 3^{5} \\]
        \\[ \\dfrac{t}{4} = 5 \\quad \\Rightarrow \\quad t = 20 \\]
        Jadi kapasitas tercapai setelah <b>20 jam</b>.`
    },
    {
      id: 2,
      type: "MC",
      text: `Sebuah perusahaan membeli mesin produksi seharga Rp100.000.000,00. Nilai mesin menyusut 50% setiap tahun. Modelnya:<br>
             \\[ V(t) = 100{.}000{.}000 \\cdot (0{,}5)^{t} \\]<br>
             Manajemen ingin menjual mesin saat nilainya tepat Rp12.500.000,00.<br><br>
             <b>Berapa tahun masa pakai mesin tersebut?</b>`,
      options: [
        { text: "3 tahun", isCorrect: true },
        { text: "4 tahun", isCorrect: false },
        { text: "5 tahun", isCorrect: false },
        { text: "6 tahun", isCorrect: false },
        { text: "7 tahun", isCorrect: false }
      ],
      explanation: `
        \\[ 100{.}000{.}000 \\cdot (0{,}5)^{t} = 12{.}500{.}000 \\]
        \\[ (0{,}5)^{t} = 0{,}125 = \\dfrac{1}{8} = (0{,}5)^{3} \\]
        \\[ t = 3 \\]
        Jadi masa pakai mesin adalah <b>3 tahun</b>.`
    },
    {
      id: 3,
      type: "MC",
      text: `Rani menabung di bank dengan saldo awal Rp3.000.000,00. Saldo setelah \\( t \\) tahun dimodelkan oleh:<br>
             \\[ S(t) = 3{.}000{.}000 \\cdot 2^{t} \\]<br>
             Rani ingin mengambil uang saat saldo mencapai Rp24.000.000,00.<br><br>
             <b>Berapa tahun Rani harus menabung?</b>`,
      options: [
        { text: "2 tahun", isCorrect: false },
        { text: "3 tahun", isCorrect: true },
        { text: "4 tahun", isCorrect: false },
        { text: "5 tahun", isCorrect: false },
        { text: "6 tahun", isCorrect: false }
      ],
      explanation: `
        \\[ 3{.}000{.}000 \\cdot 2^{t} = 24{.}000{.}000 \\]
        \\[ 2^{t} = 8 = 2^{3} \\]
        \\[ t = 3 \\]
        Jadi Rani harus menabung selama <b>3 tahun</b>.`
    },
    {
      id: 4,
      type: "MC",
      text: `Pada hari pertama mesin menghasilkan 100 produk. Setiap hari produksi naik menjadi 3 kali lipat dari hari sebelumnya:<br>
             \\[ U(n) = 100 \\cdot 3^{n-1} \\]<br>
             Gudang hanya mampu menampung maksimal 5.000 produk per hari.<br><br>
             <b>Pada hari ke berapa jumlah produksi harian untuk pertama kalinya melampaui kapasitas gudang?</b>`,
      options: [
        { text: "Hari ke-3", isCorrect: false },
        { text: "Hari ke-4", isCorrect: false },
        { text: "Hari ke-5", isCorrect: true },
        { text: "Hari ke-6", isCorrect: false },
        { text: "Hari ke-7", isCorrect: false }
      ],
      explanation: `
        Hitung sampai melebihi 5.000:<br>
        \\( n=1 \\): 100<br>
        \\( n=2 \\): 300<br>
        \\( n=3 \\): 900<br>
        \\( n=4 \\): 2.700<br>
        \\( n=5 \\): 8.100 > 5.000<br>
        Jadi pertama kali melampaui pada <b>hari ke-5</b>.`
    },
    {
      id: 5,
      type: "MA",
      text: `Raka merintis akun TikTok edukasi sains. Pada awal pengamatan terdapat 100 pengikut. Jumlah pengikut tumbuh 20% setiap hari.<br><br>
             <b>Tentukan dua pernyataan yang benar!</b><br>
             <span class="note">(Jawaban bisa lebih dari satu)</span>`,
      options: [
        { text: "Fungsi jumlah pengikut setelah \\( x \\) hari: \\( f(x) = 100 \\cdot (1{,}2)^{x} \\)", isCorrect: true },
        { text: "Jumlah pengikut tepat pada hari ke-3 adalah 150 orang", isCorrect: false },
        { text: "Waktu minimum agar pengikut mencapai/melampaui 170 orang adalah hari ke-2", isCorrect: false },
        { text: "Jumlah pengikut pada hari ke-1 adalah 120 orang", isCorrect: true },
        { text: "Rumus pertumbuhan harian adalah \\( f(x) = 100 + 0{,}2x \\)", isCorrect: false }
      ],
      explanation: `
        Model yang benar: \\( f(x) = 100 \\cdot (1{,}2)^{x} \\).<br>
        - Hari ke-1: \\( 100 \\times 1{,}2 = 120 \\) (benar)<br>
        - Hari ke-3: \\( 100 \\times 1{,}2^{3} = 172{,}8 \\) (bukan 150)<br>
        - Hari ke-2: \\( 100 \\times 1{,}44 = 144 \\) (belum mencapai 170)<br>
        - Pertumbuhan linear \\( 100 + 0{,}2x \\) salah (bukan eksponensial).<br>
        Jadi pernyataan yang benar adalah yang pertama dan keempat.`
    }
  ];

  // ===================== STATE =====================
  let shuffledQuestions = [];
  let currentQuestionIndex = 0;
  let userAnswers = {};
  let startTime;
  let accessGranted = false;

  // ===================== INIT =====================
  window.onload = function() {
    // Isi rombel X
    const kelasSelect = document.getElementById("kelas");
    for (let i = 1; i <= 12; i++) {
      const num = i < 10 ? "0" + i : "" + i;
      kelasSelect.innerHTML += `<option value="X-${num}">X-${num}</option>`;
    }
    const presensiSelect = document.getElementById("noPresensi");
    for (let i = 1; i <= 40; i++) {
      presensiSelect.innerHTML += `<option value="${i}">${i}</option>`;
    }

    checkAccess();
  };

  function checkAccess() {
    const now = new Date();
    const inWindow = now >= openTime && now < closeTime;

    if (inWindow || accessGranted) {
      document.getElementById("gateSection").classList.add("hidden");
      document.getElementById("formSection").classList.remove("hidden");
    } else {
      document.getElementById("gateSection").classList.remove("hidden");
      document.getElementById("formSection").classList.add("hidden");
      const gateMsg = document.getElementById("gateMessage");
      gateMsg.style.display = "block";
      const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jakarta' };
      if (now < openTime) {
        document.getElementById("gateText").innerHTML =
          `Kuis belum dibuka.<br>Dibuka: <strong>${openTime.toLocaleString('id-ID', opts)} WIB</strong><br>Ditutup: <strong>${closeTime.toLocaleString('id-ID', opts)} WIB</strong>`;
      } else {
        document.getElementById("gateText").innerHTML =
          `Kuis sudah ditutup.<br>Periode akses: 10–16 September 2026.<br>Masukkan password untuk akses khusus.`;
      }
    }
  }

  function tryPassword() {
    const pw = document.getElementById("accessPassword").value.trim();
    if (pw === ACCESS_PASSWORD) {
      accessGranted = true;
      checkAccess();
    } else {
      alert("Password salah!");
    }
  }

  function shuffle(array) {
    const newArray = JSON.parse(JSON.stringify(array));
    for (let i = newArray.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => alert("Gagal fullscreen: " + err.message));
    } else if (document.exitFullscreen) document.exitFullscreen();
  }

  function isPembahasanUnlocked() {
    return new Date() >= unlockPembahasan;
  }

  // ===================== MULAI KUIS =====================
  function startQuiz() {
    const kelas = document.getElementById("kelas").value;
    const noPresensi = document.getElementById("noPresensi").value;
    const nama = document.getElementById("nama").value.trim();
    if (!kelas || !noPresensi || !nama) {
      alert("Harap lengkapi semua data diri terlebih dahulu!");
      return;
    }
    document.getElementById("formSection").classList.add("hidden");
    document.getElementById("quizSection").classList.remove("hidden");
    startTime = new Date();
    shuffledQuestions = shuffle(originalQuestions);
    shuffledQuestions.forEach(q => { q.options = shuffle(q.options); });
    currentQuestionIndex = 0;
    userAnswers = {};
    renderCurrentQuestion();
  }

  function renderCurrentQuestion() {
    const container = document.getElementById("questionContainer");
    const q = shuffledQuestions[currentQuestionIndex];
    const inputType = q.type === "MC" ? "radio" : "checkbox";
    const selected = userAnswers[currentQuestionIndex] || [];

    let optionsHTML = q.options.map((opt, optIdx) => {
      const isChecked = selected.includes(optIdx) ? "checked" : "";
      const selectedClass = selected.includes(optIdx) ? "selected" : "";
      return `
        <label class="option-item ${selectedClass}">
          <input type="${inputType}" name="opt_${currentQuestionIndex}" value="${optIdx}" ${isChecked}
                 onchange="saveAnswer(${optIdx}, '${q.type}')">
          <span>${opt.text}</span>
        </label>`;
    }).join("");

    container.innerHTML = `
      <div class="question-card">
        <div class="question-title">Soal ${currentQuestionIndex + 1} dari ${shuffledQuestions.length}
          ${q.type === "MA" ? '<span style="font-weight:500;color:#64748b;font-size:0.9rem;">(Jawaban bisa lebih dari satu)</span>' : ''}
        </div>
        <div class="question-text">${q.text}</div>
        <div>${optionsHTML}</div>
      </div>`;

    document.getElementById("progressBar").style.width = ((currentQuestionIndex / shuffledQuestions.length) * 100) + "%";
    document.getElementById("btnPrev").classList.toggle("hidden", currentQuestionIndex === 0);
    if (currentQuestionIndex === shuffledQuestions.length - 1) {
      document.getElementById("btnNext").classList.add("hidden");
      document.getElementById("btnSubmit").classList.remove("hidden");
    } else {
      document.getElementById("btnNext").classList.remove("hidden");
      document.getElementById("btnSubmit").classList.add("hidden");
    }

    if (window.renderMathInElement) {
      renderMathInElement(container, {
        delimiters: [{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],
        throwOnError: false
      });
    }
  }

  function saveAnswer(optIdx, type) {
    if (type === "MC") {
      userAnswers[currentQuestionIndex] = [optIdx];
    } else {
      if (!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = [];
      const arr = userAnswers[currentQuestionIndex];
      const pos = arr.indexOf(optIdx);
      if (pos > -1) arr.splice(pos, 1); else arr.push(optIdx);
    }
    renderCurrentQuestion();
  }

  function changeQuestion(direction) {
    currentQuestionIndex += direction;
    renderCurrentQuestion();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  // ===================== SUBMIT =====================
  function submitQuiz() {
    const scorePerQ = 100 / shuffledQuestions.length;
    let totalScore = 0;

    shuffledQuestions.forEach((q, idx) => {
      const sel = userAnswers[idx] || [];
      if (q.type === "MC") {
        if (sel.length === 1 && q.options[sel[0]].isCorrect) totalScore += scorePerQ;
      } else {
        const correctCount = q.options.filter(o => o.isCorrect).length;
        let userCorrect = 0, userWrong = 0;
        sel.forEach(s => { if (q.options[s].isCorrect) userCorrect++; else userWrong++; });
        if (userWrong === 0 && userCorrect > 0) totalScore += scorePerQ * (userCorrect / correctCount);
      }
    });
    totalScore = Math.round(totalScore);

    const endTime = new Date();
    const dur = Math.floor((endTime - startTime) / 1000);
    const waktuFormatted = `${Math.floor(dur/60)} menit ${dur%60} detik`;

    document.getElementById("quizSection").classList.add("hidden");
    document.getElementById("resultSection").classList.remove("hidden");
    document.getElementById("scoreDisplay").innerText = totalScore;
    document.getElementById("scoreSub").innerText = `dari 100  •  Waktu: ${waktuFormatted}`;
    document.getElementById("progressBar").style.width = "100%";

    sendToGoogleSheet(totalScore, waktuFormatted);
    renderPembahasanArea();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function renderPembahasanArea() {
    const area = document.getElementById("pembahasanArea");
    if (!isPembahasanUnlocked()) {
      const opts = { weekday:'long', year:'numeric', month:'long', day:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'Asia/Jakarta' };
      area.innerHTML = `
        <div class="locked-box">
          <div class="lock-icon">🔒</div>
          <h4>Pembahasan masih terkunci</h4>
          <p>Pembahasan akan dibuka pada:<br><strong>${unlockPembahasan.toLocaleString('id-ID', opts)} WIB</strong></p>
          <p style="margin-top:12px;font-size:0.88rem;">Nilai Anda sudah tercatat. Silakan kembali setelah waktu tersebut.</p>
        </div>`;
    } else {
      let html = "";
      shuffledQuestions.forEach((q, idx) => {
        const sel = userAnswers[idx] || [];
        let isCorrect = false;
        if (q.type === "MC") {
          isCorrect = sel.length === 1 && q.options[sel[0]].isCorrect;
        } else {
          const correctKeys = q.options.map((o,i) => o.isCorrect ? i : -1).filter(i => i !== -1).sort();
          const userKeys = [...sel].sort();
          isCorrect = JSON.stringify(correctKeys) === JSON.stringify(userKeys);
        }
        const badge = isCorrect ? `<span class="badge badge-benar">Benar</span>` : `<span class="badge badge-salah">Salah</span>`;
        html += `
          <div class="question-card" style="margin-bottom:20px;">
            <div class="question-title">Soal Nomor ${idx+1} ${badge}</div>
            <div class="question-text">${q.text}</div>
            <div class="pembahasan-box">
              <div class="pembahasan-header">Pembahasan:</div>
              <div>${q.explanation}</div>
            </div>
          </div>`;
      });
      area.innerHTML = html;
      if (window.renderMathInElement) {
        renderMathInElement(area, {
          delimiters: [{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false}],
          throwOnError: false
        });
      }
    }
  }

  function sendToGoogleSheet(nilai, waktu) {
    const payload = new URLSearchParams();
    payload.append("kuisKe", kuisKe);
    payload.append("kelas", document.getElementById("kelas").value);
    payload.append("noPresensi", document.getElementById("noPresensi").value);
    payload.append("nama", document.getElementById("nama").value.trim());
    payload.append("nilai", nilai);
    payload.append("waktu", waktu);

    fetch(webAppsUrl, {
      method: "POST", mode: "no-cors",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: payload
    })
    .then(() => {
      const el = document.getElementById("statusSending");
      el.className = "status-msg status-success";
      el.innerText = "✓ Nilai berhasil tersimpan di Google Sheet (Sheet 13)!";
    })
    .catch(() => {
      const el = document.getElementById("statusSending");
      el.className = "status-msg status-error";
      el.innerText = "Terjadi kesalahan saat mengirim data.";
    });
  }
</script>
