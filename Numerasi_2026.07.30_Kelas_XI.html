<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Fungsi Invers - Kelas XI</title>

  <!-- KaTeX CSS & JS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --border: #e2e8f0;
      --success: #16a34a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
    .container { width: 100%; max-width: 800px; background: var(--card-bg); padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); position: relative; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid var(--border); padding-bottom: 12px; }
    .btn-fs { background: #64748b; color: white; border: none; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
    .btn-fs:hover { background: #475569; }

    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    select, input[type="text"] { width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 1rem; }

    .btn { background: var(--primary); color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: 600; }
    .btn:hover { background: var(--primary-hover); }
    .btn-secondary { background: #64748b; }
    .btn-secondary:hover { background: #475569; }

    .nav-buttons { display: flex; justify-content: space-between; margin-top: 20px; }

    .question-card { padding: 20px; border: 1px solid var(--border); border-radius: 8px; background: #fafafa; }
    .question-title { font-weight: 700; margin-bottom: 12px; color: var(--primary); font-size: 1.1rem; }
    .option-item { display: flex; align-items: flex-start; margin-bottom: 10px; cursor: pointer; background: white; padding: 12px; border: 1px solid var(--border); border-radius: 6px; }
    .option-item:hover { background: #f1f5f9; }
    .option-item input { margin-right: 12px; margin-top: 4px; }

    .hidden { display: none; }

    .pembahasan-box { background-color: #fefce8; border: 1px solid #fef08a; padding: 16px; border-radius: 8px; margin-top: 12px; font-size: 0.95rem; line-height: 1.6; }
    .pembahasan-header { font-weight: bold; color: #854d0e; margin-bottom: 8px; }
    .status-msg { text-align: center; padding: 12px; margin-top: 15px; border-radius: 6px; font-weight: 600; }
    .status-success { background: #dcfce7; color: #15803d; }
    .status-loading { background: #e0f2fe; color: #0369a1; }
  </style>
</head>
<body>

<div class="container" id="mainContainer">
  <div class="top-bar">
    <h2>Kuis Matematika - Fungsi Invers & Komposisi</h2>
    <button class="btn-fs" onclick="toggleFullscreen()">Layar Penuh ⛶</button>
  </div>

  <!-- Form Data Diri -->
  <div id="formSection">
    <div class="form-group">
      <label for="tingkatKelas">Tingkat Kelas:</label>
      <select id="tingkatKelas" onchange="updateRombelOptions()">
        <option value="">-- Pilih Tingkat --</option>
        <option value="XI">Kelas XI</option>
      </select>
    </div>

    <div class="form-group">
      <label for="kelas">Rombel Kelas:</label>
      <select id="kelas">
        <option value="">-- Pilih Tingkat Terlebih Dahulu --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="noPresensi">No Presensi:</label>
      <select id="noPresensi">
        <option value="">-- Pilih No Presensi --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="nama">Nama Singkat:</label>
      <input type="text" id="nama" placeholder="Masukkan nama panggilan / singkat">
    </div>

    <button class="btn" style="width: 100%; margin-top: 10px;" onclick="startQuiz()">Mulai Kuis</button>
  </div>

  <!-- Quiz Section (Per Nomor) -->
  <div id="quizSection" class="hidden">
    <div id="questionContainer"></div>

    <div class="nav-buttons">
      <button id="btnPrev" class="btn btn-secondary" onclick="changeQuestion(-1)">Sebelumnya</button>
      <button id="btnNext" class="btn" onclick="changeQuestion(1)">Selanjutnya</button>
      <button id="btnSubmit" class="btn hidden" style="background: var(--success);" onclick="submitQuiz()">Selesai & Kirim</button>
    </div>
  </div>

  <!-- Result & Pembahasan Section -->
  <div id="resultSection" class="hidden">
    <h3>Hasil Kuis Anda</h3>
    <p id="scoreDisplay" style="font-size: 1.2rem; font-weight: bold; margin: 12px 0;"></p>
    <div id="statusSending" class="status-msg status-loading">Mengirim nilai ke Google Sheet...</div>

    <hr style="margin: 24px 0;">
    <h3>Pembahasan Soal Lengkap</h3>
    <div id="pembahasanContainer" style="margin-top: 16px;"></div>
  </div>
</div>

<script>
  // Disesuaikan menjadi "2" agar rumus Apps Script (4 + kuisKe) menghasilkan "Sheet6"
  const kuisKe = "2";
  const webAppsUrl = "https://script.google.com/macros/s/AKfycbxVl8biOVtl1JJPC9ezT1DKx3fBO6Bp_gQFAnTbwQqJ0igKZuKdwuuHgXd5wi0vaMvD/exec";

  /* ============================================================
     CATATAN PENTING SOAL ESCAPE BACKSLASH:
     Di dalam string JavaScript, setiap backslash "\" yang
     dimaksudkan untuk LaTeX HARUS ditulis doubled "\", karena
     JavaScript engine akan mengonsumsi satu backslash sebagai
     escape character. Jika tidak, \( akan menjadi ( saja di DOM,
     sehingga KaTeX tidak pernah menemukan delimiternya.
     ============================================================ */

  const originalQuestions = [
    {
      id: 1,
      type: "MC",
      text: "Perhatikan pernyataan berikut:<br>" +
            "(1) Setiap fungsi memiliki fungsi invers.<br>" +
            "(2) Fungsi yang memiliki invers harus bersifat satu-satu (injektif).<br>" +
            "(3) Fungsi yang memiliki invers harus memasangkan setiap anggota kodomain dengan tepat satu anggota domain.<br>" +
            "Pernyataan yang benar adalah ....",
      options: [
        { text: "(1) saja", isCorrect: false },
        { text: "(2) saja", isCorrect: false },
        { text: "(2) dan (3)", isCorrect: true },
        { text: "(1), (2), dan (3)", isCorrect: false }
      ],
      explanation: "Tidak semua fungsi memiliki invers (hanya fungsi bijektif/korespondensi satu-satu yang memilikinya). Oleh karena itu, pernyataan (1) salah, sedangkan pernyataan (2) dan (3) benar."
    },
    {
      id: 2,
      type: "MC",
      text: "Suatu fungsi \\(f(x)\\) memetakan himpunan A ke himpunan B. Dua anggota berbeda di A ternyata dipetakan ke anggota yang sama di B.<br>Kesimpulan yang benar adalah ....",
      options: [
        { text: "Fungsi tersebut pasti mempunyai invers.", isCorrect: false },
        { text: "Fungsi tersebut tidak mungkin mempunyai invers.", isCorrect: true },
        { text: "Fungsi tersebut pasti fungsi konstan.", isCorrect: false },
        { text: "Fungsi tersebut pasti surjektif.", isCorrect: false }
      ],
      explanation: "Karena ada dua anggota berbeda di domain yang dipetakan ke anggota yang sama di kodomain, fungsi ini bukan fungsi satu-satu (injektif). Syarat fungsi memiliki invers adalah harus injektif dan surjektif (bijektif), sehingga fungsi ini tidak mungkin mempunyai invers."
    },
    {
      id: 3,
      type: "MC",
      text: "Setiap siswa memiliki NIS berbeda. Mengapa sistem ini dapat dianggap memiliki fungsi invers?",
      options: [
        { text: "Satu siswa banyak NIS", isCorrect: false },
        { text: "Setiap NIS dapat digunakan menemukan tepat satu siswa", isCorrect: true },
        { text: "Semua siswa satu kelas", isCorrect: false },
        { text: "NIS berupa angka", isCorrect: false }
      ],
      explanation: "Sistem NIS bersifat korespondensi satu-satu: satu siswa memiliki satu NIS unik, dan setiap satu NIS secara pasti (unik) memetakan kembali ke tepat satu siswa."
    },
    {
      id: 4,
      type: "MC",
      text: "Seorang guru menyatakan bahwa fungsi invers dapat digunakan untuk mengembalikan hasil suatu proses ke keadaan semula.<br>Pernyataan tersebut berarti bahwa ....",
      options: [
        { text: "invers selalu menghasilkan bilangan yang lebih kecil.", isCorrect: false },
        { text: "invers membatalkan kerja fungsi asal.", isCorrect: true },
        { text: "invers selalu berupa fungsi linear.", isCorrect: false },
        { text: "invers mempunyai domain yang sama dengan fungsi asal.", isCorrect: false }
      ],
      explanation: "Fungsi invers merupakan kebalikan dari fungsi asal, sehingga mengaplikasikan fungsi invers pada hasil pemetaan akan membatalkan (membalikkan) kerja fungsi asal dan mengembalikannya ke nilai awal."
    },
    {
      id: 5,
      type: "MC",
      text: "Sebuah mesin mengubah nomor peserta menjadi nomor ujian. Ternyata ada dua peserta yang memperoleh nomor ujian yang sama.<br>Akibatnya adalah ....",
      options: [
        { text: "Nomor peserta dapat ditentukan kembali secara tepat.", isCorrect: false },
        { text: "Mesin tersebut mempunyai fungsi invers.", isCorrect: false },
        { text: "Mesin tersebut tidak mempunyai fungsi invers.", isCorrect: true },
        { text: "Mesin tersebut pasti surjektif.", isCorrect: false }
      ],
      explanation: "Karena dua peserta mendapatkan nomor ujian yang sama, pemetaan balik dari nomor ujian ke nomor peserta akan menghasilkan dua kemungkinan (tidak unik). Hal ini menyebabkan pemetaan kebalikannya bukan merupakan fungsi, sehingga mesin tersebut tidak mempunyai fungsi invers."
    },
    {
      id: 6,
      type: "MC",
      text: "Agar proses membuat kopi memiliki invers diperlukan...",
      options: [
        { text: "Harga", isCorrect: false },
        { text: "Langkah dan takaran tepat", isCorrect: true },
        { text: "Nama pembeli", isCorrect: false },
        { text: "Warna cangkir", isCorrect: false }
      ],
      explanation: "Agar suatu proses terdefinisi dengan pasti dan dapat direkonstruksi/dibalik secara presisi, diperlukan langkah-langkah dan takaran yang jelas dan konsisten."
    },
    {
      id: 7,
      type: "MC",
      text: "Sebuah toko online memiliki dua proses.<br>" +
            "Fungsi \\(f\\): memilih barang \(\rightarrow\) menghasilkan harga barang.<br>" +
            "Fungsi \\(g\\): harga barang \(\rightarrow\) menghitung harga setelah diskon.<br>" +
            "Tanpa melakukan perhitungan, komposisi yang tepat untuk memperoleh harga akhir setelah diskon dari barang yang dipilih adalah ....",
      options: [
        { text: "\\(g \\circ f\\)", isCorrect: true },
        { text: "\\(f \\circ g\\)", isCorrect: false },
        { text: "\\(f + g\\)", isCorrect: false },
        { text: "\\(g - f\\)", isCorrect: false }
      ],
      explanation: "Proses diawali dengan memilih barang melalui fungsi \\(f\\), kemudian dilanjutkan dengan menghitung diskon melalui fungsi \\(g\\). Dalam notasi komposisi fungsi, urutan kerja dari pertama ke kedua dituliskan sebagai \\((g \\circ f)(x) = g(f(x))\\)."
    },
    {
      id: 8,
      type: "MC",
      text: "Suatu proses terdiri atas dua tahap:<br>" +
            "(1) Mengubah suhu dari Celsius ke Fahrenheit.<br>" +
            "(2) Menentukan kategori cuaca berdasarkan suhu Fahrenheit.<br>" +
            "Jika kedua tahap dinyatakan sebagai fungsi, maka urutan komposisi yang benar adalah ....",
      options: [
        { text: "Menentukan kategori terlebih dahulu, kemudian mengubah satuan suhu.", isCorrect: false },
        { text: "Mengubah suhu ke Fahrenheit, kemudian menentukan kategori cuaca.", isCorrect: true },
        { text: "Kedua urutan selalu menghasilkan hasil yang sama.", isCorrect: false },
        { text: "Tidak dapat dinyatakan sebagai komposisi fungsi.", isCorrect: false }
      ],
      explanation: "Kategori cuaca ditentukan berdasarkan suhu Fahrenheit, sehingga input untuk penentuan kategori harus berupa suhu Fahrenheit terlebih dahulu. Jadi, suhu harus diubah ke Fahrenheit terlebih dahulu sebelum kategori cuaca ditentukan."
    },
    {
      id: 9,
      type: "MC",
      text: "Diketahui dua fungsi.<br>" +
            "Fungsi pertama mengubah kode produk menjadi nama produk.<br>" +
            "Fungsi kedua mengubah nama produk menjadi harga produk.<br>" +
            "Jika seorang kasir hanya mengetahui kode produk, maka fungsi yang harus diterapkan terlebih dahulu adalah ....",
      options: [
        { text: "Fungsi kedua.", isCorrect: false },
        { text: "Fungsi pertama.", isCorrect: true },
        { text: "Kedua fungsi bersamaan.", isCorrect: false },
        { text: "Tidak dapat ditentukan.", isCorrect: false }
      ],
      explanation: "Kasir membawa input berupa kode produk. Fungsi pertama menerima kode produk dan menghasilkan nama produk. Setelah nama produk didapatkan, baru fungsi kedua diterapkan untuk mendapatkan harga produk."
    },
    {
      id: 10,
      type: "MC",
      text: "Mengapa fungsi konstan tidak mempunyai fungsi invers?",
      options: [
        { text: "Karena semua nilai domain dipetakan ke satu nilai yang sama sehingga hasilnya tidak dapat dibalik secara unik.", isCorrect: true },
        { text: "Karena domainnya kosong.", isCorrect: false },
        { text: "Karena grafiknya mendatar.", isCorrect: false },
        { text: "Karena kodomainnya terlalu banyak.", isCorrect: false }
      ],
      explanation: "Pada fungsi konstan, semua elemen domain dipetakan ke satu nilai keluaran yang sama. Saat hendak dibalik, satu nilai keluaran tersebut akan memetakan balik ke banyak nilai domain, sehingga pemetaan kebalikannya bukan merupakan fungsi (tidak injektif)."
    }
  ];

  let shuffledQuestions = [];
  let currentQuestionIndex = 0;
  let userAnswers = {};
  let startTime;

  // Konfigurasi delimiter KaTeX
  const katexDelimiters = [
    { left: "\\(", right: "\\)", display: false },
    { left: "\\[", right: "\\]", display: true }
  ];

  window.onload = function() {
    const presensiSelect = document.getElementById("noPresensi");
    for (let i = 1; i <= 36; i++) {
      presensiSelect.innerHTML += `<option value="${i}">${i}</option>`;
    }
  };

  function safeRenderMath(element) {
    if (typeof renderMathInElement === "function") {
      renderMathInElement(element, { delimiters: katexDelimiters });
    } else {
      setTimeout(function() {
        if (typeof renderMathInElement === "function") {
          renderMathInElement(element, { delimiters: katexDelimiters });
        }
      }, 150);
    }
  }

  function updateRombelOptions() {
    const tingkat = document.getElementById("tingkatKelas").value;
    const kelasSelect = document.getElementById("kelas");
    kelasSelect.innerHTML = '<option value="">-- Pilih Rombel --</option>';

    if (tingkat) {
      for (let i = 1; i <= 12; i++) {
        let num = i < 10 ? "0" + i : i;
        kelasSelect.innerHTML += `<option value="${tingkat}-${num}">${tingkat}-${num}</option>`;
      }
    } else {
      kelasSelect.innerHTML = '<option value="">-- Pilih Tingkat Terlebih Dahulu --</option>';
    }
  }

  function shuffle(array) {
    let newArray = JSON.parse(JSON.stringify(array));
    for (let i = newArray.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
    }
    return newArray;
  }

  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => alert("Gagal fullscreen: " + err.message));
    } else {
      if (document.exitFullscreen) document.exitFullscreen();
    }
  }

  function startQuiz() {
    const tingkat = document.getElementById("tingkatKelas").value;
    const kelas = document.getElementById("kelas").value;
    const noPresensi = document.getElementById("noPresensi").value;
    const nama = document.getElementById("nama").value.trim();

    if (!tingkat || !kelas || !noPresensi || !nama) {
      alert("Harap lengkapi semua data diri terlebih dahulu!");
      return;
    }

    document.getElementById("formSection").classList.add("hidden");
    document.getElementById("quizSection").classList.remove("hidden");

    startTime = new Date();
    shuffledQuestions = shuffle(originalQuestions);
    shuffledQuestions.forEach(q => q.options = shuffle(q.options));

    currentQuestionIndex = 0;
    userAnswers = {};
    renderCurrentQuestion();
  }

  function renderCurrentQuestion() {
    const container = document.getElementById("questionContainer");
    const q = shuffledQuestions[currentQuestionIndex];
    const inputType = q.type === "MC" ? "radio" : "checkbox";

    let optionsHTML = q.options.map((opt, optIdx) => {
      const isChecked = userAnswers[currentQuestionIndex] && userAnswers[currentQuestionIndex].includes(optIdx) ? "checked" : "";
      return `
        <label class="option-item">
          <input type="${inputType}" name="opt_${currentQuestionIndex}" value="${optIdx}" ${isChecked} onchange="saveAnswer(${optIdx}, '${q.type}')">
          <span>${opt.text}</span>
        </label>
      `;
    }).join("");

    container.innerHTML = `
      <div class="question-card">
        <div class="question-title">Soal ${currentQuestionIndex + 1} dari ${shuffledQuestions.length}</div>
        <div style="font-size: 1.05rem; margin-bottom: 12px;">${q.text}</div>
        <div>${optionsHTML}</div>
      </div>
    `;

    document.getElementById("btnPrev").classList.toggle("hidden", currentQuestionIndex === 0);
    if (currentQuestionIndex === shuffledQuestions.length - 1) {
      document.getElementById("btnNext").classList.add("hidden");
      document.getElementById("btnSubmit").classList.remove("hidden");
    } else {
      document.getElementById("btnNext").classList.remove("hidden");
      document.getElementById("btnSubmit").classList.add("hidden");
    }

    safeRenderMath(container);
  }

  function saveAnswer(optIdx, type) {
    if (type === "MC") {
      userAnswers[currentQuestionIndex] = [optIdx];
    } else {
      if (!userAnswers[currentQuestionIndex]) userAnswers[currentQuestionIndex] = [];
      const indexInArr = userAnswers[currentQuestionIndex].indexOf(optIdx);
      if (indexInArr > -1) {
        userAnswers[currentQuestionIndex].splice(indexInArr, 1);
      } else {
        userAnswers[currentQuestionIndex].push(optIdx);
      }
    }
  }

  function changeQuestion(direction) {
    currentQuestionIndex += direction;
    renderCurrentQuestion();
  }

  function submitQuiz() {
    let scorePerQuestion = 100 / shuffledQuestions.length;
    let totalScore = 0;

    shuffledQuestions.forEach((q, idx) => {
      const selectedIndices = userAnswers[idx] || [];
      if (q.type === "MC") {
        if (selectedIndices.length > 0 && q.options[selectedIndices[0]].isCorrect) {
          totalScore += scorePerQuestion;
        }
      } else if (q.type === "MA") {
        let correctCount = q.options.filter(o => o.isCorrect).length;
        let userCorrectCount = 0;
        let userWrongCount = 0;

        selectedIndices.forEach(sIdx => {
          if (q.options[sIdx].isCorrect) userCorrectCount++;
          else userWrongCount++;
        });

        if (userWrongCount === 0 && userCorrectCount > 0) {
          totalScore += scorePerQuestion * (userCorrectCount / correctCount);
        }
      }
    });

    totalScore = Math.round(totalScore);

    const endTime = new Date();
    const durationSec = Math.floor((endTime - startTime) / 1000);
    const minutes = Math.floor(durationSec / 60);
    const seconds = durationSec % 60;
    const waktuFormatted = `${minutes} menit ${seconds} detik`;

    document.getElementById("quizSection").classList.add("hidden");
    document.getElementById("resultSection").classList.remove("hidden");
    document.getElementById("scoreDisplay").innerText = `Nilai Anda: ${totalScore} / 100 (${waktuFormatted})`;

    renderPembahasan();
    sendToGoogleSheet(totalScore, waktuFormatted);
  }

  function renderPembahasan() {
    const container = document.getElementById("pembahasanContainer");
    container.innerHTML = "";

    shuffledQuestions.forEach((q, idx) => {
      container.innerHTML += `
        <div class="question-card" style="margin-bottom: 20px;">
          <div class="question-title">Soal Nomor ${idx + 1}</div>
          <div style="margin-bottom: 10px;">${q.text}</div>
          <div class="pembahasan-box">
            <div class="pembahasan-header">Pembahasan:</div>
            <div>${q.explanation}</div>
          </div>
        </div>
      `;
    });

    safeRenderMath(container);
  }

  function sendToGoogleSheet(nilai, waktu) {
    const kelas = document.getElementById("kelas").value;
    const noPresensi = document.getElementById("noPresensi").value;
    const nama = document.getElementById("nama").value.trim();

    const payload = new URLSearchParams();
    payload.append("kuisKe", String(kuisKe));
    payload.append("kelas", String(kelas));
    payload.append("noPresensi", String(noPresensi));
    payload.append("nama", String(nama));
    payload.append("nilai", String(nilai));
    payload.append("waktu", String(waktu));

    fetch(webAppsUrl, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "application/x-www-form-urlencoded"
      },
      body: payload
    })
    .then(() => {
      const statusElem = document.getElementById("statusSending");
      statusElem.className = "status-msg status-success";
      statusElem.innerText = "✓ Nilai berhasil tersimpan di Google Sheet!";
    })
    .catch(error => {
      const statusElem = document.getElementById("statusSending");
      statusElem.innerText = "Terjadi kesalahan saat mengirim data.";
      console.error("Error:", error);
    });
  }
</script>

</body>
</html>
